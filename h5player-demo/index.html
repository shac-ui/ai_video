<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>H5Player 视频监控播放器</title>
  <link rel="stylesheet" href="player.css" />
</head>
<body>
  <div class="app-wrapper">
    <!-- 顶部导航 -->
    <header class="top-bar">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="14" fill="#3b82f6"/>
          <polygon points="11,9 21,14 11,19" fill="white"/>
        </svg>
        <span class="logo-text">H5Player</span>
        <span class="version-badge">v2.5.1</span>
      </div>
      <nav class="top-nav">
        <button class="nav-btn active" data-mode="preview">实时预览</button>
        <button class="nav-btn" data-mode="playback">录像回放</button>
      </nav>
      <div class="top-actions">
        <span class="label-sm" style="margin-right:4px">分屏</span>
        <button class="icon-btn split-btn active" data-split="1" title="1×1">
          <svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="12" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        </button>
        <button class="icon-btn split-btn" data-split="2" title="2×2">
          <svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="1" width="5" height="5" rx="0.5" stroke="currentColor" stroke-width="1.5" fill="none"/><rect x="8" y="1" width="5" height="5" rx="0.5" stroke="currentColor" stroke-width="1.5" fill="none"/><rect x="1" y="8" width="5" height="5" rx="0.5" stroke="currentColor" stroke-width="1.5" fill="none"/><rect x="8" y="8" width="5" height="5" rx="0.5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        </button>
        <button class="icon-btn split-btn" data-split="3" title="3×3">
          <svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="1" width="3" height="3" rx="0.3" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="5.5" y="1" width="3" height="3" rx="0.3" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="10" y="1" width="3" height="3" rx="0.3" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="1" y="5.5" width="3" height="3" rx="0.3" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="5.5" y="5.5" width="3" height="3" rx="0.3" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="10" y="5.5" width="3" height="3" rx="0.3" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="1" y="10" width="3" height="3" rx="0.3" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="5.5" y="10" width="3" height="3" rx="0.3" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="10" y="10" width="3" height="3" rx="0.3" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
        </button>
        <button class="icon-btn split-btn" data-split="4" title="4×4">
          <svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="1" width="2.5" height="2.5" fill="currentColor" rx="0.2"/><rect x="4.5" y="1" width="2.5" height="2.5" fill="currentColor" rx="0.2"/><rect x="8" y="1" width="2.5" height="2.5" fill="currentColor" rx="0.2"/><rect x="11.5" y="1" width="2.5" height="2.5" fill="currentColor" rx="0.2"/><rect x="1" y="4.5" width="2.5" height="2.5" fill="currentColor" rx="0.2"/><rect x="4.5" y="4.5" width="2.5" height="2.5" fill="currentColor" rx="0.2"/><rect x="8" y="4.5" width="2.5" height="2.5" fill="currentColor" rx="0.2"/><rect x="11.5" y="4.5" width="2.5" height="2.5" fill="currentColor" rx="0.2"/><rect x="1" y="8" width="2.5" height="2.5" fill="currentColor" rx="0.2"/><rect x="4.5" y="8" width="2.5" height="2.5" fill="currentColor" rx="0.2"/><rect x="8" y="8" width="2.5" height="2.5" fill="currentColor" rx="0.2"/><rect x="11.5" y="8" width="2.5" height="2.5" fill="currentColor" rx="0.2"/><rect x="1" y="11.5" width="2.5" height="2.5" fill="currentColor" rx="0.2"/><rect x="4.5" y="11.5" width="2.5" height="2.5" fill="currentColor" rx="0.2"/><rect x="8" y="11.5" width="2.5" height="2.5" fill="currentColor" rx="0.2"/><rect x="11.5" y="11.5" width="2.5" height="2.5" fill="currentColor" rx="0.2"/></svg>
        </button>
        <div class="divider-v"></div>
        <button class="btn-outline sm" id="btn-whole-fullscreen">整体全屏</button>
        <button class="btn-outline sm" id="btn-single-fullscreen">单窗全屏</button>
      </div>
    </header>

    <div class="main-layout">
      <!-- 左侧面板 -->
      <aside class="sidebar">

        <!-- 解码模式 -->
        <section class="panel-section">
          <h3 class="section-title">
            <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 2h10v10H2z" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M5 5h4v4H5z" fill="currentColor"/></svg>
            解码模式
          </h3>
          <div class="tab-pills" id="decode-tabs">
            <button class="tab-pill active" data-mode="0">普通模式</button>
            <button class="tab-pill" data-mode="1">高级模式</button>
          </div>
          <p class="hint-text">普通模式(MSE)兼容性更好；高级模式支持更多编码格式</p>
        </section>

        <!-- 预览配置 -->
        <section class="panel-section" id="preview-section">
          <h3 class="section-title">
            <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="2" fill="currentColor"/><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
            预览配置
          </h3>
          <div class="form-group">
            <label>预览 URL</label>
            <input type="text" id="realplay-url" class="form-input" placeholder="wss://host:port/.../EUrl/..." />
          </div>
          <div class="form-group">
            <label>安全 Token（可选）</label>
            <input type="text" id="auth-token" class="form-input" placeholder="安全认证 Token" />
          </div>
          <div class="btn-group">
            <button class="btn-primary flex-1" id="btn-realplay">
              <svg width="12" height="12" viewBox="0 0 12 12"><polygon points="2,1 11,6 2,11" fill="currentColor"/></svg>
              开始预览
            </button>
            <button class="btn-danger flex-1" id="btn-stop-realplay">
              <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" rx="1" fill="currentColor"/></svg>
              停止预览
            </button>
          </div>
          <button class="btn-outline sm full-width mt-8" id="btn-stopall">停止全部窗口</button>
        </section>

        <!-- 即时回放 -->
        <section class="panel-section" id="instant-section">
          <h3 class="section-title">
            <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 2a5 5 0 100 10A5 5 0 007 2z" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M5 5l2 2 2-2M5 7l2 2 2-2" stroke="currentColor" stroke-width="1" stroke-linecap="round" fill="none"/></svg>
            即时回放（预览附加）
          </h3>
          <div class="form-group">
            <label>缓冲时长（秒）</label>
            <select id="instant-time" class="form-input">
              <option value="10">10 秒</option>
              <option value="20">20 秒</option>
              <option value="30">30 秒</option>
            </select>
          </div>
          <div class="btn-group">
            <button class="btn-outline xs" id="btn-instant-open">开启即时回放</button>
            <button class="btn-outline xs" id="btn-instant-start">开始</button>
            <button class="btn-outline xs" id="btn-instant-stop">停止</button>
          </div>
          <div class="btn-group mt-8">
            <button class="btn-outline xs" id="btn-instant-total">总时长</button>
            <button class="btn-outline xs" id="btn-instant-curr">当前时长</button>
          </div>
        </section>

        <!-- 回放配置 -->
        <section class="panel-section" id="playback-section" style="display:none">
          <h3 class="section-title">
            <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M7 4v3l2 1.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
            回放配置
          </h3>
          <div class="form-group">
            <label>回放 URL</label>
            <input type="text" id="playback-url" class="form-input" placeholder="wss://host:port/.../EUrl/..." />
          </div>
          <div class="form-group">
            <label>开始时间</label>
            <input type="datetime-local" id="start-time" class="form-input" step="1" />
          </div>
          <div class="form-group">
            <label>结束时间</label>
            <input type="datetime-local" id="end-time" class="form-input" step="1" />
          </div>
          <div class="btn-group">
            <button class="btn-primary flex-1" id="btn-playback-start">
              <svg width="12" height="12" viewBox="0 0 12 12"><polygon points="2,1 11,6 2,11" fill="currentColor"/></svg>
              正向回放
            </button>
            <button class="btn-outline flex-1" id="btn-reverse-start">
              <svg width="12" height="12" viewBox="0 0 12 12"><polygon points="10,1 1,6 10,11" fill="currentColor"/></svg>
              倒向回放
            </button>
          </div>
        </section>

        <!-- 回放控制 -->
        <section class="panel-section" id="playback-controls-section" style="display:none">
          <h3 class="section-title">
            <svg width="14" height="14" viewBox="0 0 14 14"><polygon points="2,1 9,7 2,13" fill="currentColor"/><rect x="10" y="1" width="2" height="12" fill="currentColor"/></svg>
            回放控制
          </h3>
          <div class="btn-group">
            <button class="icon-btn sm" id="btn-pause" title="暂停">
              <svg width="14" height="14" viewBox="0 0 14 14"><rect x="2.5" y="2" width="3.5" height="10" rx="0.8" fill="currentColor"/><rect x="8" y="2" width="3.5" height="10" rx="0.8" fill="currentColor"/></svg>
            </button>
            <button class="icon-btn sm" id="btn-resume" title="恢复正向">
              <svg width="14" height="14" viewBox="0 0 14 14"><polygon points="3,2 12,7 3,12" fill="currentColor"/></svg>
            </button>
            <button class="icon-btn sm" id="btn-resume-reverse" title="恢复倒向">
              <svg width="14" height="14" viewBox="0 0 14 14"><polygon points="11,2 2,7 11,12" fill="currentColor"/></svg>
            </button>
            <button class="icon-btn sm" id="btn-frame-back" title="单帧退">
              <svg width="14" height="14" viewBox="0 0 14 14"><polygon points="11,2 4,7 11,12" fill="currentColor"/><rect x="1.5" y="2" width="2.5" height="10" rx="0.6" fill="currentColor"/></svg>
            </button>
            <button class="icon-btn sm" id="btn-frame-forward" title="单帧进">
              <svg width="14" height="14" viewBox="0 0 14 14"><polygon points="3,2 10,7 3,12" fill="currentColor"/><rect x="10" y="2" width="2.5" height="10" rx="0.6" fill="currentColor"/></svg>
            </button>
            <button class="icon-btn sm" id="btn-change-mode" title="正/倒放切换">
              <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7h10M9 4l3 3-3 3M5 4L2 7l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
            </button>
          </div>
          <div class="form-group mt-8">
            <label>快放 / 慢放</label>
            <div class="btn-group">
              <button class="btn-outline sm" id="btn-slow">慢放</button>
              <button class="btn-outline sm" id="btn-fast">快放</button>
              <span class="speed-indicator">当前: <b id="current-rate">1x</b></span>
            </div>
          </div>
          <div class="form-group">
            <label>直接倍数</label>
            <div class="btn-group">
              <select id="speed-select" class="form-input" style="flex:1">
                <option value="-8">⅛x</option>
                <option value="-4">¼x</option>
                <option value="-2">½x</option>
                <option value="1" selected>1x</option>
                <option value="2">2x</option>
                <option value="4">4x</option>
                <option value="8">8x</option>
                <option value="16">16x</option>
                <option value="32">32x</option>
                <option value="64">64x</option>
              </select>
              <button class="btn-outline sm" id="btn-speed">应用</button>
            </div>
          </div>
          <div class="form-group">
            <label>定位到时间点</label>
            <div class="btn-group">
              <input type="datetime-local" id="seek-time" class="form-input" step="1" style="flex:1" />
              <button class="btn-outline sm" id="btn-seek">定位</button>
            </div>
          </div>
          <button class="btn-danger sm full-width" id="btn-stop-playback">停止回放</button>
        </section>

        <!-- 对讲 -->
        <section class="panel-section">
          <h3 class="section-title">
            <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1.5a2.5 2.5 0 012.5 2.5v3a2.5 2.5 0 01-5 0V4A2.5 2.5 0 017 1.5z" fill="currentColor"/><path d="M3 7a4 4 0 008 0M7 11v2M5 13h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
            语音对讲
          </h3>
          <div class="form-group">
            <label>对讲 URL</label>
            <input type="text" id="talk-url" class="form-input" placeholder="wss://host:port/.../EUrl/..." />
          </div>
          <div class="btn-group">
            <button class="btn-outline sm flex-1" id="btn-talk-start">开始对讲</button>
            <button class="btn-outline sm flex-1" id="btn-talk-stop">停止对讲</button>
          </div>
          <div class="form-group mt-8">
            <label>对讲录音</label>
            <div class="btn-group">
              <select id="audio-type" class="form-input" style="flex:1">
                <option value="0">设备声音</option>
                <option value="1">客户端声音</option>
                <option value="2" selected>双向声音</option>
              </select>
              <button class="btn-outline sm" id="btn-record-talk">录制</button>
              <button class="btn-outline sm" id="btn-stop-record-talk">停止</button>
            </div>
          </div>
        </section>

      </aside>

      <!-- 中间播放区域 -->
      <main class="player-area">
        <div id="player" class="player-container"></div>

        <!-- 播放器底部工具栏 -->
        <div class="player-toolbar">
          <div class="toolbar-left">
            <!-- 音量控制 -->
            <button class="tool-btn" id="btn-open-sound">
              <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 5h2.5l3.5-2.5v9L4.5 9H2V5z" fill="currentColor"/><path d="M9 5a2.5 2.5 0 010 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
              开声音
            </button>
            <button class="tool-btn" id="btn-close-sound">
              <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 5h2.5l3.5-2.5v9L4.5 9H2V5z" fill="currentColor"/><line x1="10" y1="5" x2="13" y2="9" stroke="currentColor" stroke-width="1.4"/><line x1="13" y1="5" x2="10" y2="9" stroke="currentColor" stroke-width="1.4"/></svg>
              关声音
            </button>
            <div class="volume-row">
              <input type="range" id="volume-slider" class="slider" min="1" max="100" value="50" />
              <span class="volume-value" id="volume-display">50</span>
            </div>
            <div class="divider-v"></div>
            <!-- 截图录像 -->
            <button class="tool-btn" id="btn-capture">
              <svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="3.5" width="12" height="8.5" rx="1.5" stroke="currentColor" stroke-width="1.2" fill="none"/><circle cx="7" cy="8" r="2" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M4.5 3.5l.8-1.5h3.4l.8 1.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
              抓图
            </button>
            <button class="tool-btn" id="btn-record-mp4">
              <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="3" fill="#ef4444"/><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
              <span id="record-label">录制MP4</span>
            </button>
            <button class="tool-btn" id="btn-record-ps">
              <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="3" fill="#f59e0b"/><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
              录制PS
            </button>
            <button class="tool-btn" id="btn-record-stop" style="display:none">
              <svg width="14" height="14" viewBox="0 0 14 14"><rect x="3" y="3" width="8" height="8" rx="1" fill="#ef4444"/><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
              停止录制
            </button>
            <div class="divider-v"></div>
            <!-- 电子放大 / 旋转 / 缩放 -->
            <button class="tool-btn" id="btn-zoom-enable">
              <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.2" fill="none"/><line x1="9.5" y1="9.5" x2="13" y2="13" stroke="currentColor" stroke-width="1.4"/><line x1="6" y1="3.5" x2="6" y2="8.5" stroke="currentColor" stroke-width="1.2"/><line x1="3.5" y1="6" x2="8.5" y2="6" stroke="currentColor" stroke-width="1.2"/></svg>
              电子放大
            </button>
            <button class="tool-btn" id="btn-zoom-disable" style="display:none">
              <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.2" fill="none"/><line x1="9.5" y1="9.5" x2="13" y2="13" stroke="currentColor" stroke-width="1.4"/><line x1="3.5" y1="6" x2="8.5" y2="6" stroke="currentColor" stroke-width="1.2"/></svg>
              关闭放大
            </button>
          </div>
          <div class="toolbar-right">
            <div class="osd-time" id="osd-time-display">--:--:--</div>
            <button class="tool-btn" id="btn-get-video-info">
              <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M7 6.5v4M7 4.5v1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
              视频信息
            </button>
          </div>
        </div>
      </main>

      <!-- 右侧面板 -->
      <aside class="sidebar right-sidebar">

        <!-- 画面调整 -->
        <section class="panel-section">
          <h3 class="section-title">
            <svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 11l8-8M3 3h8v8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
            画面调整
          </h3>
          <div class="form-group">
            <label>旋转角度</label>
            <select id="rotate-select" class="form-input">
              <option value="0">0°</option>
              <option value="90">90°</option>
              <option value="180">180°</option>
              <option value="270">270°</option>
            </select>
          </div>
          <div class="form-group">
            <label>缩放比例</label>
            <select id="scale-select" class="form-input">
              <option value="fill">平铺</option>
              <option value="original">原始分辨率</option>
              <option value="16:9">16:9</option>
              <option value="4:3">4:3</option>
              <option value="9:16">9:16</option>
              <option value="3:4">3:4</option>
            </select>
          </div>
          <button class="btn-outline sm full-width" id="btn-scale-cancel">还原旋转/缩放</button>
        </section>

        <!-- 智能信息 -->
        <section class="panel-section">
          <h3 class="section-title">
            <svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="3" width="12" height="8" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M4 6h6M4 9h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
            智能信息（高级模式）
          </h3>
          <div class="btn-group">
            <button class="btn-outline sm flex-1" id="btn-intellect-open">开启</button>
            <button class="btn-outline sm flex-1" id="btn-intellect-close">关闭</button>
          </div>
        </section>

        <!-- 缩略图 -->
        <section class="panel-section">
          <h3 class="section-title">
            <svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="3" width="5" height="4" rx="0.8" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="8" y="3" width="5" height="4" rx="0.8" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="1" y="9" width="5" height="2.5" rx="0.8" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="8" y="9" width="5" height="2.5" rx="0.8" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
            缩略图（回放）
          </h3>
          <div class="form-group">
            <label>指定时间</label>
            <input type="datetime-local" id="thumbnail-time" class="form-input" step="1" />
          </div>
          <div class="btn-group">
            <button class="btn-outline xs flex-1" id="btn-thumbnails-open">开启缩略图</button>
            <button class="btn-outline xs flex-1" id="btn-thumbnails-get">获取缩略图</button>
            <button class="btn-outline xs flex-1" id="btn-thumbnails-close">停止缩略图</button>
          </div>
          <div id="thumbnail-preview" class="thumbnail-preview" style="display:none">
            <img id="thumbnail-img" src="" alt="缩略图" style="width:100%;border-radius:4px;margin-top:8px;" />
          </div>
        </section>

        <!-- 抓图水印 -->
        <section class="panel-section">
          <h3 class="section-title">
            <svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 10l3-3 2 2 3-4 4 5H1z" stroke="currentColor" stroke-width="1.2" fill="none"/><circle cx="4" cy="4" r="1.5" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
            抓图水印
          </h3>
          <div class="form-group">
            <label>水印文字</label>
            <input type="text" id="wm-text" class="form-input" value="h5player" />
          </div>
          <div class="watermark-row">
            <div class="form-group" style="flex:1">
              <label>间隔(px)</label>
              <input type="number" id="wm-space" class="form-input" value="240" />
            </div>
            <div class="form-group" style="flex:1">
              <label>角度(°)</label>
              <input type="number" id="wm-degree" class="form-input" value="-15" />
            </div>
          </div>
          <div class="form-group">
            <label>字体</label>
            <input type="text" id="wm-font" class="form-input" value="24px 微软雅黑" />
          </div>
          <div class="form-group">
            <label>颜色</label>
            <input type="text" id="wm-color" class="form-input" value="rgba(255,255,255,0.5)" />
          </div>
          <div class="btn-group">
            <button class="btn-outline sm flex-1" id="btn-watermark-set">设置水印</button>
            <button class="btn-outline sm flex-1" id="btn-watermark-cancel">清除水印</button>
          </div>
        </section>

        <!-- 视频信息面板 -->
        <section class="panel-section">
          <h3 class="section-title">
            <svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 2h9v8H1z" stroke="currentColor" stroke-width="1.2" fill="none" rx="1"/><path d="M10 5l3-2v6l-3-2V5z" fill="currentColor"/></svg>
            视频信息
          </h3>
          <div class="info-grid">
            <div class="info-item"><span class="info-label">编码格式</span><span class="info-value" id="info-codec">--</span></div>
            <div class="info-item"><span class="info-label">分辨率</span><span class="info-value" id="info-resolution">--</span></div>
            <div class="info-item"><span class="info-label">帧率</span><span class="info-value" id="info-framerate">--</span></div>
            <div class="info-item"><span class="info-label">码率</span><span class="info-value" id="info-bitrate">--</span></div>
            <div class="info-item"><span class="info-label">音频</span><span class="info-value" id="info-audio">--</span></div>
            <div class="info-item"><span class="info-label">封装</span><span class="info-value" id="info-format">--</span></div>
          </div>
        </section>

        <!-- 状态日志 -->
        <section class="panel-section log-section">
          <h3 class="section-title">
            <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 3h10M2 6h8M2 9h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
            状态日志
            <button class="icon-btn xs float-right" id="btn-clear-log" title="清空">
              <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 3h8l-1 7H3L2 3z" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M1 3h10M4 3V1h4v2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
            </button>
          </h3>
          <div class="log-container" id="log-container"></div>
        </section>
      </aside>
    </div>
  </div>

  <!-- Toast 通知 -->
  <div class="toast-container" id="toast-container"></div>

  <!-- h5player 核心库，szBasePath 必须指向该文件所在目录 -->
  <script src="../h5player/demo/h5player.min.js"></script>
  <script src="player.js"></script>
</body>
</html>
